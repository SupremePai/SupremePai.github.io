<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiant Ideal Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181c24;
    --surface3: #1f2330;
    --border: #2a2f3d;
    --border-bright: #3d4460;
    --text: #d4cfc4;
    --text-dim: #6b6e7a;
    --text-bright: #ede8e0;
    --stormlight: #7eb8d4;
    --stormlight-glow: rgba(126,184,212,0.15);
    --gold: #c9a84c;
    --gold-dim: rgba(201,168,76,0.15);

    --merkulio: #6db88a;
    --merkulio-glow: rgba(109,184,138,0.12);
    --zulanai: #d47eb8;
    --zulanai-glow: rgba(212,126,184,0.12);
    --veln: #7eb8d4;
    --veln-glow: rgba(126,184,212,0.12);
    --arshqqam: #d4a87e;
    --arshqqam-glow: rgba(212,168,126,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 40px 24px 80px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 40% at 50% 0%, rgba(126,184,212,0.04) 0%, transparent 70%),
      radial-gradient(ellipse 60% 60% at 10% 80%, rgba(109,184,138,0.03) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 90% 20%, rgba(212,168,126,0.03) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    transition: opacity 0.3s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-text {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.6;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

  header { text-align: center; margin-bottom: 32px; }
  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.8;
  }
  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(22px, 4vw, 36px);
    font-weight: 600;
    color: var(--text-bright);
    letter-spacing: 0.06em;
    line-height: 1.2;
    margin-bottom: 10px;
  }
  .header-rule {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 14px auto 0;
    opacity: 0.5;
  }

  .session-bar {
    max-width: 1100px;
    margin: 0 auto 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .session-bar.active {
    border-color: rgba(201,168,76,0.4);
    background: linear-gradient(135deg, var(--surface) 0%, rgba(201,168,76,0.04) 100%);
  }
  .session-info { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
  .session-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--text-dim);
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .session-name {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 0.04em;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-name.inactive { color: var(--text-dim); font-weight: 400; font-style: italic; }
  .session-meta { font-size: 11px; color: var(--text-dim); }
  .session-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .sbtn {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    padding: 7px 14px;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
  }
  .sbtn:hover { border-color: var(--gold); color: var(--gold); }
  .sbtn.primary { border-color: var(--gold); color: var(--gold); }
  .sbtn.primary:hover { background: var(--gold); color: var(--bg); }
  .sbtn.danger:hover { border-color: #c0535a; color: #c0535a; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,12,16,0.85);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 400;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--gold);
    border-radius: 2px;
    padding: 28px 32px;
    width: min(440px, 90vw);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-title {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 18px;
    text-align: center;
  }
  .modal-hint {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 16px;
    font-style: italic;
  }
  .modal-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    color: var(--text-bright);
    padding: 10px 12px;
    font-family: 'Crimson Pro', serif;
    font-size: 14px;
    border-radius: 2px;
    outline: none;
    margin-bottom: 18px;
  }
  .modal-input:focus { border-color: var(--gold); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

  .table-wrap { overflow-x: auto; border-radius: 2px; }
  table { width: 100%; border-collapse: collapse; min-width: 700px; }

  thead tr.char-row th {
    padding: 0 8px 0;
    text-align: center;
    vertical-align: bottom;
  }
  thead tr.char-row th:first-child {
    text-align: left;
    width: 180px;
  }
  .char-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 16px;
    border-radius: 2px 2px 0 0;
    position: relative;
    gap: 4px;
  }
  .char-header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 10%;
    right: 10%;
    height: 1px;
  }
  .char-icon { font-size: 22px; margin-bottom: 4px; filter: drop-shadow(0 0 6px currentColor); }
  .char-name {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .char-path { font-size: 11px; opacity: 0.55; font-style: italic; letter-spacing: 0.02em; }

  th.col-merkulio .char-header { background: var(--merkulio-glow); }
  th.col-merkulio .char-header::after { background: var(--merkulio); opacity: 0.4; }
  th.col-merkulio .char-name { color: var(--merkulio); }
  th.col-zulanai .char-header { background: var(--zulanai-glow); }
  th.col-zulanai .char-header::after { background: var(--zulanai); opacity: 0.4; }
  th.col-zulanai .char-name { color: var(--zulanai); }
  th.col-veln .char-header { background: var(--veln-glow); }
  th.col-veln .char-header::after { background: var(--veln); opacity: 0.4; }
  th.col-veln .char-name { color: var(--veln); }
  th.col-arshqqam .char-header { background: var(--arshqqam-glow); }
  th.col-arshqqam .char-header::after { background: var(--arshqqam); opacity: 0.4; }
  th.col-arshqqam .char-name { color: var(--arshqqam); }

  thead tr.divider-row th { height: 2px; padding: 0; background: var(--border); }
  thead tr.divider-row th:first-child { background: transparent; }

  tbody tr.ideal-data-row {
    border-bottom: 1px solid rgba(42,47,61,0.5);
    transition: background 0.15s;
  }
  tbody tr.ideal-data-row:hover { background: rgba(255,255,255,0.015); }

  td.ideal-label { padding: 14px 16px 14px 4px; vertical-align: middle; }
  .ideal-name-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .ideal-name-wrap:hover .ideal-name { color: var(--text-bright); }
  .ideal-caret {
    font-size: 9px;
    color: var(--text-dim);
    transition: transform 0.2s;
    width: 10px;
    display: inline-block;
  }
  tr.ideal-data-row.expanded .ideal-caret { transform: rotate(90deg); color: var(--gold); }
  .ideal-name {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    transition: color 0.2s;
  }
  tr.ideal-data-row.expanded .ideal-name { color: var(--gold); }

  td.val-cell { padding: 10px 8px; text-align: center; vertical-align: middle; }
  .counter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 5px 8px;
    transition: border-color 0.2s, box-shadow 0.2s;
    min-width: 90px;
    justify-content: center;
  }
  .counter:hover { border-color: var(--border-bright); }

  .btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 2px;
    transition: color 0.15s, background 0.15s;
    font-family: 'Crimson Pro', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
  }
  .btn:hover { color: var(--text-bright); background: rgba(255,255,255,0.06); }
  .btn:active { transform: scale(0.9); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .val {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 600;
    min-width: 24px;
    display: inline-block;
    text-align: center;
    transition: color 0.2s;
    color: var(--text-dim);
  }
  .val.nonzero { color: var(--text-bright); }

  td.col-merkulio .counter:hover { border-color: var(--merkulio); box-shadow: 0 0 8px var(--merkulio-glow); }
  td.col-merkulio .val.nonzero { color: var(--merkulio); }
  td.col-merkulio .btn:hover { color: var(--merkulio); }
  td.col-zulanai .counter:hover { border-color: var(--zulanai); box-shadow: 0 0 8px var(--zulanai-glow); }
  td.col-zulanai .val.nonzero { color: var(--zulanai); }
  td.col-zulanai .btn:hover { color: var(--zulanai); }
  td.col-veln .counter:hover { border-color: var(--veln); box-shadow: 0 0 8px var(--veln-glow); }
  td.col-veln .val.nonzero { color: var(--veln); }
  td.col-veln .btn:hover { color: var(--veln); }
  td.col-arshqqam .counter:hover { border-color: var(--arshqqam); box-shadow: 0 0 8px var(--arshqqam-glow); }
  td.col-arshqqam .val.nonzero { color: var(--arshqqam); }
  td.col-arshqqam .btn:hover { color: var(--arshqqam); }

  tr.ideal-data-row.current-ideal td.ideal-label .ideal-name { color: var(--gold); opacity: 0.8; }
  tr.ideal-data-row.current-ideal td.val-cell .counter {
    background: var(--gold-dim);
    border-color: rgba(201,168,76,0.2);
  }
  tr.ideal-data-row.current-ideal td.val-cell .val.nonzero { color: var(--gold) !important; }

  tr.history-row { display: none; }
  tr.history-row.open { display: table-row; }
  tr.history-row td {
    padding: 0;
    background: var(--surface);
    border-bottom: 1px solid rgba(42,47,61,0.5);
  }
  .history-wrap {
    padding: 16px 20px 20px;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .history-empty {
    padding: 20px;
    text-align: center;
    color: var(--text-dim);
    font-style: italic;
    font-size: 12px;
  }
  .history-session { margin-bottom: 14px; }
  .history-session:last-child { margin-bottom: 0; }
  .history-session-hdr {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(201,168,76,0.15);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .history-session-name { flex: 1; }
  .history-session-date { color: var(--text-dim); font-weight: 400; font-size: 10px; letter-spacing: 0.08em; }
  .history-events {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    font-size: 12px;
  }
  .history-event {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 0;
  }
  .history-char {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .history-char.merkulio { color: var(--merkulio); }
  .history-char.zulanai { color: var(--zulanai); }
  .history-char.veln { color: var(--veln); }
  .history-char.arshqqam { color: var(--arshqqam); }
  .history-delta-plus { color: var(--merkulio); font-weight: 600; }
  .history-delta-minus { color: #c0535a; font-weight: 600; }
  .history-arrow { color: var(--text-dim); }
  .history-newval {
    font-family: 'Cinzel', serif;
    color: var(--text-bright);
    font-weight: 600;
  }

  .save-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
    gap: 12px;
  }
  .save-note {
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .save-note.saving { color: var(--stormlight); }
  .save-note.saved { color: var(--merkulio); }
  .save-note.error { color: #c0535a; font-style: normal; }
  .save-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.6;
  }
  .save-note.saving .save-dot { animation: pulse 1s ease-in-out infinite; }

  .reset-btn {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
  }
  .reset-btn:hover { border-color: #c0535a; color: #c0535a; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .container, .session-bar { animation: fadeUp 0.5s ease both; }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-text">Summoning Stormlight…</div>
</div>

<div class="container">
  <header>
    <p class="eyebrow">Stonewalkers Campaign</p>
    <h1>Radiant Ideal Tracker</h1>
    <div class="header-rule"></div>
  </header>
</div>

<div class="session-bar" id="sessionBar">
  <div class="session-info">
    <span class="session-label">Session</span>
    <div>
      <div class="session-name inactive" id="sessionName">No active session</div>
      <div class="session-meta" id="sessionMeta"></div>
    </div>
  </div>
  <div class="session-actions" id="sessionActions"></div>
</div>

<div class="container">
  <div class="table-wrap">
    <table id="tracker">
      <thead>
        <tr class="char-row">
          <th></th>
          <th class="col-merkulio">
            <div class="char-header">
              <span class="char-icon">🌿</span>
              <span class="char-name">Merkulio</span>
              <span class="char-path">Agent · Thief</span>
            </div>
          </th>
          <th class="col-zulanai">
            <div class="char-header">
              <span class="char-icon">🔮</span>
              <span class="char-name">zulanai</span>
              <span class="char-path">Agent · Investigator</span>
            </div>
          </th>
          <th class="col-veln">
            <div class="char-header">
              <span class="char-icon">⚔️</span>
              <span class="char-name">Vel'n Daiyl</span>
              <span class="char-path">Leader</span>
            </div>
          </th>
          <th class="col-arshqqam">
            <div class="char-header">
              <span class="char-icon">🖋️</span>
              <span class="char-name">Arshqqam Zarb</span>
              <span class="char-path">Warrior</span>
            </div>
          </th>
        </tr>
        <tr class="divider-row">
          <th></th><th></th><th></th><th></th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">New Session</div>
    <div class="modal-hint" id="modalHint">Give this session a name.</div>
    <input class="modal-input" id="modalInput" placeholder="Session 1: the beginning" maxlength="80">
    <div class="modal-actions">
      <button class="sbtn" id="modalCancel">Cancel</button>
      <button class="sbtn primary" id="modalConfirm">Save</button>
    </div>
  </div>
</div>

<div class="save-bar">
  <span class="save-note" id="saveNote"><span class="save-dot"></span><span id="saveText">Connecting…</span></span>
  <button class="reset-btn" onclick="resetAll()">Reset All</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================================
// Supabase config — using the sb_publishable_ key format, same as nachos.
// Paste the exact same URL + publishable key your nachos page uses.
// ============================================================================
const SUPABASE_URL = 'https://yebunkxcgyezsxpcgern.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ie0DrRA1KwO6rTMqa0LsBA_MBDPXVbi';
const T_SESSIONS = 'radiant_sessions';
const T_EVENTS = 'radiant_events';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================================
// Model
// ============================================================================
const IDEALS = [
  { key: 'freedom',      label: 'Freedom' },
  { key: 'justice',      label: 'Justice' },
  { key: 'potential',    label: 'Potential' },
  { key: 'protection',   label: 'Protection' },
  { key: 'remembrance',  label: 'Remembrance' },
  { key: 'secrecy',      label: 'Secrecy' },
  { key: 'selfmastery',  label: 'Self-Mastery' },
  { key: 'tenacity',     label: 'Tenacity' },
  { key: 'truth',        label: 'Truth' },
  { key: 'currentideal', label: 'Current Ideal', special: true },
];

const CHARS = [
  { key: 'merkulio', cls: 'col-merkulio', label: 'Merkulio' },
  { key: 'zulanai',  cls: 'col-zulanai',  label: 'zulanai' },
  { key: 'veln',     cls: 'col-veln',     label: "Vel'n" },
  { key: 'arshqqam', cls: 'col-arshqqam', label: 'Arshqqam' },
];

// ============================================================================
// State
// ============================================================================
let currentSession = null;   // active session row, or null
let currentValues = {};      // { char: { ideal: value } } derived from events
let allEvents = [];          // full event history, newest first
let allSessions = [];        // all sessions, newest first
let connected = false;

// ============================================================================
// UI helpers
// ============================================================================
function setNote(cls, txt) {
  const el = document.getElementById('saveNote');
  const txtEl = document.getElementById('saveText');
  el.className = 'save-note' + (cls ? ' ' + cls : '');
  txtEl.textContent = txt;
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function charLabel(k) {
  const c = CHARS.find(x => x.key === k);
  return c ? c.label : k;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ============================================================================
// Modal — returns a promise resolving to the entered name or null
// ============================================================================
function promptSessionName(defaultName = '', title = 'New Session') {
  return new Promise(resolve => {
    const overlay = document.getElementById('modalOverlay');
    const input = document.getElementById('modalInput');
    document.getElementById('modalTitle').textContent = title;
    input.value = defaultName;
    overlay.classList.add('open');
    setTimeout(() => { input.focus(); input.select(); }, 50);

    const cleanup = () => {
      overlay.classList.remove('open');
      document.getElementById('modalConfirm').onclick = null;
      document.getElementById('modalCancel').onclick = null;
      input.onkeydown = null;
    };

    document.getElementById('modalConfirm').onclick = () => {
      const v = input.value.trim();
      if (!v) return;
      cleanup();
      resolve(v);
    };
    document.getElementById('modalCancel').onclick = () => { cleanup(); resolve(null); };
    input.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('modalConfirm').click(); }
      else if (e.key === 'Escape') { e.preventDefault(); document.getElementById('modalCancel').click(); }
    };
  });
}

// ============================================================================
// Sessions
// ============================================================================
async function startSession() {
  const defaultName = `Session ${allSessions.length + 1}: `;
  const name = await promptSessionName(defaultName, 'New Session');
  if (!name) return false;
  try {
    const { data, error } = await sb
      .from(T_SESSIONS)
      .insert({ name: name })
      .select()
      .single();
    if (error) throw error;
    currentSession = data;
    allSessions.unshift(data);
    renderSessionBar();
    return true;
  } catch (e) {
    console.error('Start session failed:', e);
    setNote('error', 'Could not start session');
    return false;
  }
}

async function endSession() {
  if (!currentSession) return;
  if (!confirm(`End session "${currentSession.name}"?`)) return;
  try {
    const now = new Date().toISOString();
    const { error } = await sb
      .from(T_SESSIONS)
      .update({ ended_at: now })
      .eq('id', currentSession.id);
    if (error) throw error;
    const idx = allSessions.findIndex(s => s.id === currentSession.id);
    if (idx >= 0) allSessions[idx].ended_at = now;
    currentSession = null;
    renderSessionBar();
  } catch (e) {
    console.error('End session failed:', e);
    setNote('error', 'Could not end session');
  }
}

async function renameSession() {
  if (!currentSession) return;
  const name = await promptSessionName(currentSession.name, 'Rename Session');
  if (!name || name === currentSession.name) return;
  try {
    const { error } = await sb
      .from(T_SESSIONS)
      .update({ name: name })
      .eq('id', currentSession.id);
    if (error) throw error;
    currentSession.name = name;
    const idx = allSessions.findIndex(s => s.id === currentSession.id);
    if (idx >= 0) allSessions[idx].name = name;
    renderSessionBar();
    // Re-render any open history rows since session names may appear there
    document.querySelectorAll('tr.history-row.open').forEach(row => {
      const idealKey = row.dataset.ideal;
      row.querySelector('.history-wrap').innerHTML = renderHistoryForIdeal(idealKey);
    });
  } catch (e) {
    console.error('Rename failed:', e);
    setNote('error', 'Rename failed');
  }
}

function renderSessionBar() {
  const bar = document.getElementById('sessionBar');
  const name = document.getElementById('sessionName');
  const meta = document.getElementById('sessionMeta');
  const actions = document.getElementById('sessionActions');

  if (currentSession) {
    bar.classList.add('active');
    name.classList.remove('inactive');
    name.textContent = currentSession.name;
    meta.textContent = 'Started ' + formatDate(currentSession.started_at);
    actions.innerHTML = `
      <button class="sbtn" onclick="renameSession()">Rename</button>
      <button class="sbtn danger" onclick="endSession()">End Session</button>
    `;
  } else {
    bar.classList.remove('active');
    name.classList.add('inactive');
    name.textContent = 'No active session';
    meta.textContent = allSessions.length > 0
      ? `${allSessions.length} past session${allSessions.length === 1 ? '' : 's'}`
      : '';
    actions.innerHTML = `<button class="sbtn primary" onclick="startSession()">Start New Session</button>`;
  }
}

// ============================================================================
// Load: sessions + events
// ============================================================================
async function loadData() {
  setNote('saving', 'Loading…');
  try {
    const [sessionsRes, eventsRes] = await Promise.all([
      sb.from(T_SESSIONS).select('*').order('started_at', { ascending: false }),
      sb.from(T_EVENTS).select('*').order('occurred_at', { ascending: false }),
    ]);
    if (sessionsRes.error) throw sessionsRes.error;
    if (eventsRes.error) throw eventsRes.error;

    allSessions = sessionsRes.data || [];
    allEvents = eventsRes.data || [];
    currentSession = allSessions.find(s => !s.ended_at) || null;

    // Derive current values from events. Events are newest-first, so the first
    // event we see for a given (char, ideal) pair is the most recent.
    currentValues = {};
    CHARS.forEach(c => {
      currentValues[c.key] = {};
      IDEALS.forEach(i => { currentValues[c.key][i.key] = 0; });
    });
    const seen = new Set();
    for (const ev of allEvents) {
      const k = `${ev.character}|${ev.ideal}`;
      if (seen.has(k)) continue;
      seen.add(k);
      if (currentValues[ev.character] && currentValues[ev.character][ev.ideal] !== undefined) {
        currentValues[ev.character][ev.ideal] = ev.value;
      }
    }

    connected = true;
    renderSessionBar();
    setNote('saved', 'Loaded');
    return true;
  } catch (e) {
    console.error('Load failed:', e);
    connected = false;
    setNote('error', 'Connection failed — edits will not be saved');
    return false;
  }
}

async function recordEvent(charKey, idealKey, delta, newValue) {
  if (!connected) { setNote('error', 'Not connected — change not saved'); return false; }
  setNote('saving', 'Saving…');
  try {
    const payload = {
      character: charKey,
      ideal: idealKey,
      value: newValue,
      delta: delta,
      session_id: currentSession ? currentSession.id : null,
    };
    const { data, error } = await sb
      .from(T_EVENTS)
      .insert(payload)
      .select()
      .single();
    if (error) throw error;
    allEvents.unshift(data);
    setNote('saved', 'Saved');
    return true;
  } catch (e) {
    console.error('Record event failed:', e);
    setNote('error', 'Save failed');
    return false;
  }
}

// ============================================================================
// +/- handler — gates on an active session
// ============================================================================
async function change(charKey, idealKey, delta) {
  if (!currentSession) {
    const shouldStart = confirm('No active session. Start one now?');
    if (!shouldStart) return;
    const ok = await startSession();
    if (!ok) return;
  }

  const current = currentValues[charKey][idealKey] ?? 0;
  const next = Math.max(0, current + delta);
  if (next === current) return;

  // Optimistic UI
  currentValues[charKey][idealKey] = next;
  renderCell(charKey, idealKey);
  pulseCell(charKey, idealKey);

  const ok = await recordEvent(charKey, idealKey, delta, next);
  if (!ok) {
    // Revert on failure
    currentValues[charKey][idealKey] = current;
    renderCell(charKey, idealKey);
    return;
  }

  // If this ideal's history is currently expanded, refresh it
  const historyRow = document.getElementById(`hist-${idealKey}`);
  if (historyRow && historyRow.classList.contains('open')) {
    historyRow.querySelector('.history-wrap').innerHTML = renderHistoryForIdeal(idealKey);
  }
}

function renderCell(charKey, idealKey) {
  const el = document.getElementById(`v-${charKey}-${idealKey}`);
  if (!el) return;
  const v = currentValues[charKey][idealKey] ?? 0;
  el.textContent = v;
  el.className = 'val' + (v > 0 ? ' nonzero' : '');
}

function pulseCell(charKey, idealKey) {
  const el = document.getElementById(`v-${charKey}-${idealKey}`);
  if (!el) return;
  el.style.transform = 'scale(1.3)';
  setTimeout(() => { el.style.transform = ''; }, 120);
}

function renderAllCells() {
  IDEALS.forEach(ideal => CHARS.forEach(char => renderCell(char.key, ideal.key)));
}

// ============================================================================
// Reset — logs compensating events, preserves history
// ============================================================================
async function resetAll() {
  if (!confirm('Reset all values to zero?\n\nHistory is preserved — this logs reset events in the active session.')) return;
  if (!currentSession) {
    const shouldStart = confirm('No active session. Start one before resetting?');
    if (!shouldStart) return;
    const ok = await startSession();
    if (!ok) return;
  }

  setNote('saving', 'Resetting…');
  const toReset = [];
  CHARS.forEach(c => {
    IDEALS.forEach(i => {
      const v = currentValues[c.key][i.key] ?? 0;
      if (v !== 0) {
        toReset.push({
          character: c.key,
          ideal: i.key,
          value: 0,
          delta: -v,
          session_id: currentSession.id,
        });
      }
    });
  });
  if (!toReset.length) { setNote('saved', 'Already zero'); return; }
  try {
    const { data, error } = await sb.from(T_EVENTS).insert(toReset).select();
    if (error) throw error;
    (data || []).forEach(ev => allEvents.unshift(ev));
    CHARS.forEach(c => IDEALS.forEach(i => { currentValues[c.key][i.key] = 0; }));
    renderAllCells();
    document.querySelectorAll('tr.history-row.open').forEach(row => {
      const ik = row.dataset.ideal;
      row.querySelector('.history-wrap').innerHTML = renderHistoryForIdeal(ik);
    });
    setNote('saved', 'Reset complete');
  } catch (e) {
    console.error('Reset failed:', e);
    setNote('error', 'Reset failed');
  }
}

// ============================================================================
// Table build
// ============================================================================
function buildTable() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  IDEALS.forEach(ideal => {
    const tr = document.createElement('tr');
    tr.className = 'ideal-data-row';
    if (ideal.special) tr.classList.add('current-ideal');
    tr.dataset.ideal = ideal.key;
    tr.id = `row-${ideal.key}`;

    const tdLabel = document.createElement('td');
    tdLabel.className = 'ideal-label';
    tdLabel.innerHTML = `
      <div class="ideal-name-wrap" onclick="toggleHistory('${ideal.key}')">
        <span class="ideal-caret">▶</span>
        <span class="ideal-name">${ideal.label}</span>
      </div>`;
    tr.appendChild(tdLabel);

    CHARS.forEach(char => {
      const td = document.createElement('td');
      td.className = `val-cell ${char.cls}`;
      td.dataset.char = char.key;
      td.dataset.ideal = ideal.key;
      const val = currentValues[char.key]?.[ideal.key] ?? 0;
      td.innerHTML = `
        <div class="counter">
          <button class="btn" onclick="change('${char.key}','${ideal.key}',-1)" title="Decrease">−</button>
          <span class="val${val > 0 ? ' nonzero' : ''}" id="v-${char.key}-${ideal.key}">${val}</span>
          <button class="btn" onclick="change('${char.key}','${ideal.key}',1)" title="Increase">+</button>
        </div>`;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);

    const histTr = document.createElement('tr');
    histTr.className = 'history-row';
    histTr.id = `hist-${ideal.key}`;
    histTr.dataset.ideal = ideal.key;
    histTr.innerHTML = `<td colspan="5"><div class="history-wrap"></div></td>`;
    tbody.appendChild(histTr);
  });
}

// ============================================================================
// History rendering
// ============================================================================
function toggleHistory(idealKey) {
  const dataRow = document.getElementById(`row-${idealKey}`);
  const histRow = document.getElementById(`hist-${idealKey}`);
  const isOpen = histRow.classList.contains('open');

  if (isOpen) {
    histRow.classList.remove('open');
    dataRow.classList.remove('expanded');
  } else {
    histRow.querySelector('.history-wrap').innerHTML = renderHistoryForIdeal(idealKey);
    histRow.classList.add('open');
    dataRow.classList.add('expanded');
  }
}

function renderHistoryForIdeal(idealKey) {
  const events = allEvents.filter(e => e.ideal === idealKey);
  if (!events.length) {
    return `<div class="history-empty">No changes recorded yet.</div>`;
  }

  const sessionMap = {};
  allSessions.forEach(s => { sessionMap[s.id] = s; });

  // Group events by session_id
  const grouped = {};
  const orderedSessionIds = [];
  events.forEach(ev => {
    const sid = ev.session_id == null ? 'nosession' : ev.session_id;
    if (!(sid in grouped)) {
      grouped[sid] = [];
      orderedSessionIds.push(sid);
    }
    grouped[sid].push(ev);
  });

  // Sessions newest-first
  orderedSessionIds.sort((a, b) => {
    if (a === 'nosession') return 1;
    if (b === 'nosession') return -1;
    const sa = sessionMap[a], sb = sessionMap[b];
    if (!sa || !sb) return 0;
    return new Date(sb.started_at) - new Date(sa.started_at);
  });

  let html = '';
  orderedSessionIds.forEach(sid => {
    const evs = grouped[sid];
    const sess = sid === 'nosession' ? null : sessionMap[sid];
    const title = sess ? sess.name : 'No session';
    const date = sess ? formatDate(sess.started_at) : '';

    html += `<div class="history-session">`;
    html += `<div class="history-session-hdr">`;
    html += `<span class="history-session-name">${escapeHtml(title)}</span>`;
    if (date) html += `<span class="history-session-date">${date}</span>`;
    html += `</div>`;
    html += `<div class="history-events">`;
    // Oldest-first within a session so the narrative reads forward
    evs.slice().reverse().forEach(ev => {
      const deltaStr = ev.delta > 0 ? `+${ev.delta}` : `${ev.delta}`;
      const deltaCls = ev.delta > 0 ? 'history-delta-plus' : 'history-delta-minus';
      html += `<span class="history-event">`;
      html += `<span class="history-char ${ev.character}">${charLabel(ev.character)}</span>`;
      html += `<span class="${deltaCls}">${deltaStr}</span>`;
      html += `<span class="history-arrow">→</span>`;
      html += `<span class="history-newval">${ev.value}</span>`;
      html += `</span>`;
    });
    html += `</div></div>`;
  });
  return html;
}

// ============================================================================
// Init
// ============================================================================
(async function init() {
  buildTable();
  await loadData();
  renderAllCells();
  document.getElementById('loadingOverlay').classList.add('hidden');
})();
</script>
