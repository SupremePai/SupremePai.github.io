<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiant Ideal Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181c24;
    --border: #2a2f3d;
    --border-bright: #3d4460;
    --text: #d4cfc4;
    --text-dim: #6b6e7a;
    --text-bright: #ede8e0;
    --stormlight: #7eb8d4;
    --stormlight-glow: rgba(126,184,212,0.15);
    --gold: #c9a84c;
    --gold-dim: rgba(201,168,76,0.15);

    --merkulio: #6db88a;
    --merkulio-glow: rgba(109,184,138,0.12);
    --kulanai: #d47eb8;
    --kulanai-glow: rgba(212,126,184,0.12);
    --veln: #7eb8d4;
    --veln-glow: rgba(126,184,212,0.12);
    --arshqqam: #d4a87e;
    --arshqqam-glow: rgba(212,168,126,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 40px 24px 80px;
    position: relative;
    overflow-x: hidden;
  }

  /* Atmospheric background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 40% at 50% 0%, rgba(126,184,212,0.04) 0%, transparent 70%),
      radial-gradient(ellipse 60% 60% at 10% 80%, rgba(109,184,138,0.03) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 90% 20%, rgba(212,168,126,0.03) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 52px;
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.8;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(22px, 4vw, 36px);
    font-weight: 600;
    color: var(--text-bright);
    letter-spacing: 0.06em;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .header-rule {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 14px auto 0;
    opacity: 0.5;
  }

  /* Table wrapper */
  .table-wrap {
    overflow-x: auto;
    border-radius: 2px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
  }

  /* Column headers (characters) */
  thead tr.char-row th {
    padding: 0 8px 0;
    text-align: center;
    vertical-align: bottom;
  }

  thead tr.char-row th:first-child {
    text-align: left;
    width: 160px;
  }

  .char-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 16px;
    border-radius: 2px 2px 0 0;
    position: relative;
    gap: 4px;
  }

  .char-header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 10%;
    right: 10%;
    height: 1px;
  }

  .char-icon {
    font-size: 22px;
    margin-bottom: 4px;
    filter: drop-shadow(0 0 6px currentColor);
  }

  .char-name {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .char-path {
    font-size: 11px;
    opacity: 0.55;
    font-style: italic;
    letter-spacing: 0.02em;
  }

  /* Merkulio */
  th.col-merkulio .char-header { background: var(--merkulio-glow); }
  th.col-merkulio .char-header::after { background: var(--merkulio); opacity: 0.4; }
  th.col-merkulio .char-name { color: var(--merkulio); }

  /* Kulanai */
  th.col-kulanai .char-header { background: var(--kulanai-glow); }
  th.col-kulanai .char-header::after { background: var(--kulanai); opacity: 0.4; }
  th.col-kulanai .char-name { color: var(--kulanai); }

  /* Vel'n */
  th.col-veln .char-header { background: var(--veln-glow); }
  th.col-veln .char-header::after { background: var(--veln); opacity: 0.4; }
  th.col-veln .char-name { color: var(--veln); }

  /* Arshqqam */
  th.col-arshqqam .char-header { background: var(--arshqqam-glow); }
  th.col-arshqqam .char-header::after { background: var(--arshqqam); opacity: 0.4; }
  th.col-arshqqam .char-name { color: var(--arshqqam); }

  /* Divider row */
  thead tr.divider-row th {
    height: 2px;
    padding: 0;
    background: var(--border);
  }
  thead tr.divider-row th:first-child { background: transparent; }

  /* Ideal rows */
  tbody tr {
    border-bottom: 1px solid rgba(42,47,61,0.5);
    transition: background 0.15s;
  }

  tbody tr:hover {
    background: rgba(255,255,255,0.015);
  }

  /* Ideal label cell */
  td.ideal-label {
    padding: 14px 16px 14px 4px;
    vertical-align: middle;
  }

  .ideal-name {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    display: block;
  }

  /* Value cell */
  td.val-cell {
    padding: 10px 8px;
    text-align: center;
    vertical-align: middle;
  }

  .counter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 5px 8px;
    transition: border-color 0.2s, box-shadow 0.2s;
    min-width: 90px;
    justify-content: center;
  }

  .counter:hover {
    border-color: var(--border-bright);
  }

  .btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 2px;
    transition: color 0.15s, background 0.15s;
    font-family: 'Crimson Pro', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
  }

  .btn:hover {
    color: var(--text-bright);
    background: rgba(255,255,255,0.06);
  }

  .btn:active { transform: scale(0.9); }

  .val {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 600;
    min-width: 24px;
    display: inline-block;
    text-align: center;
    transition: color 0.2s;
    color: var(--text-dim);
  }

  .val.nonzero { color: var(--text-bright); }

  /* Color tints per character column */
  td.col-merkulio .counter:hover { border-color: var(--merkulio); box-shadow: 0 0 8px var(--merkulio-glow); }
  td.col-merkulio .val.nonzero { color: var(--merkulio); }
  td.col-merkulio .btn:hover { color: var(--merkulio); }

  td.col-kulanai .counter:hover { border-color: var(--kulanai); box-shadow: 0 0 8px var(--kulanai-glow); }
  td.col-kulanai .val.nonzero { color: var(--kulanai); }
  td.col-kulanai .btn:hover { color: var(--kulanai); }

  td.col-veln .counter:hover { border-color: var(--veln); box-shadow: 0 0 8px var(--veln-glow); }
  td.col-veln .val.nonzero { color: var(--veln); }
  td.col-veln .btn:hover { color: var(--veln); }

  td.col-arshqqam .counter:hover { border-color: var(--arshqqam); box-shadow: 0 0 8px var(--arshqqam-glow); }
  td.col-arshqqam .val.nonzero { color: var(--arshqqam); }
  td.col-arshqqam .btn:hover { color: var(--arshqqam); }

  /* Current ideal row — special */
  tr.ideal-row td.ideal-label .ideal-name {
    color: var(--gold);
    opacity: 0.8;
  }

  tr.ideal-row td.val-cell .counter {
    background: var(--gold-dim);
    border-color: rgba(201,168,76,0.2);
  }

  tr.ideal-row td.val-cell .val.nonzero { color: var(--gold) !important; }

  /* Save indicator */
  .save-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
    gap: 12px;
  }

  .save-note {
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
  }

  .save-note.dirty { color: var(--gold); }

  .save-btn {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 8px 20px;
    cursor: pointer;
    border-radius: 1px;
    transition: background 0.2s, color 0.2s;
  }

  .save-btn:hover {
    background: var(--gold);
    color: var(--bg);
  }

  .reset-btn {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 1px;
    transition: border-color 0.2s, color 0.2s;
  }

  .reset-btn:hover {
    border-color: #c0535a;
    color: #c0535a;
  }

  .btn-group { display: flex; gap: 8px; }

  /* Fade in on load */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .container { animation: fadeUp 0.5s ease both; }
</style>
</head>
<body>
<div class="container">
  <header>
    <p class="eyebrow">Stonewalkers Campaign</p>
    <h1>Radiant Ideal Tracker</h1>
    <div class="header-rule"></div>
  </header>

  <div class="table-wrap">
    <table id="tracker">
      <thead>
        <tr class="char-row">
          <th></th>
          <th class="col-merkulio">
            <div class="char-header">
              <span class="char-icon">🌿</span>
              <span class="char-name">Merkulio</span>
              <span class="char-path">Agent · Thief</span>
            </div>
          </th>
          <th class="col-kulanai">
            <div class="char-header">
              <span class="char-icon">🔮</span>
              <span class="char-name">Kulanai</span>
              <span class="char-path">Agent · Investigator</span>
            </div>
          </th>
          <th class="col-veln">
            <div class="char-header">
              <span class="char-icon">⚔️</span>
              <span class="char-name">Vel'n Daiyl</span>
              <span class="char-path">Leader</span>
            </div>
          </th>
          <th class="col-arshqqam">
            <div class="char-header">
              <span class="char-icon">🖋️</span>
              <span class="char-name">Arshqqam Zarb</span>
              <span class="char-path">Warrior</span>
            </div>
          </th>
        </tr>
        <tr class="divider-row">
          <th></th><th></th><th></th><th></th><th></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <!-- Rows injected by JS -->
      </tbody>
    </table>
  </div>
</div>

<div class="save-bar">
  <span class="save-note" id="saveNote">Values saved locally in your browser.</span>
  <div class="btn-group">
    <button class="reset-btn" onclick="resetAll()">Reset All</button>
    <button class="save-btn" onclick="saveData()">Save</button>
  </div>
</div>

<script>
const IDEALS = [
  { key: 'freedom',     label: 'Freedom' },
  { key: 'justice',     label: 'Justice' },
  { key: 'potential',   label: 'Potential' },
  { key: 'protection',  label: 'Protection' },
  { key: 'remembrance', label: 'Remembrance' },
  { key: 'secrecy',     label: 'Secrecy' },
  { key: 'selfmastery', label: 'Self-Mastery' },
  { key: 'tenacity',    label: 'Tenacity' },
  { key: 'truth',       label: 'Truth' },
  { key: 'currentideal', label: 'Current Ideal', special: true },
];

const CHARS = [
  { key: 'merkulio',  cls: 'col-merkulio' },
  { key: 'kulanai',   cls: 'col-kulanai' },
  { key: 'veln',      cls: 'col-veln' },
  { key: 'arshqqam',  cls: 'col-arshqqam' },
];

const DEFAULTS = {
  merkulio:  { freedom:0, justice:1, potential:1, protection:1, remembrance:1, secrecy:1, selfmastery:1, tenacity:1, truth:0, currentideal:0 },
  kulanai:   { freedom:0, justice:0, potential:0, protection:0, remembrance:2, secrecy:0, selfmastery:1, tenacity:0, truth:3, currentideal:0 },
  veln:      { freedom:1, justice:1, potential:1, protection:1, remembrance:2, secrecy:0, selfmastery:0, tenacity:0, truth:0, currentideal:0 },
  arshqqam:  { freedom:0, justice:1, potential:4, protection:2, remembrance:0, secrecy:1, selfmastery:1, tenacity:2, truth:0, currentideal:0 },
};

const STORAGE_KEY = 'radiant_ideal_tracker_v1';
let dirty = false;

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULTS));
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  dirty = false;
  updateSaveNote();
}

function resetAll() {
  if (!confirm('Reset all values to starting defaults?')) return;
  Object.assign(state, JSON.parse(JSON.stringify(DEFAULTS)));
  renderValues();
  dirty = true;
  updateSaveNote();
  saveData();
}

function updateSaveNote() {
  const el = document.getElementById('saveNote');
  el.textContent = dirty
    ? 'Unsaved changes.'
    : 'Values saved locally in your browser.';
  el.className = 'save-note' + (dirty ? ' dirty' : '');
}

let state = loadData();

function buildTable() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  IDEALS.forEach(ideal => {
    const tr = document.createElement('tr');
    if (ideal.special) tr.classList.add('ideal-row');

    // Label cell
    const tdLabel = document.createElement('td');
    tdLabel.className = 'ideal-label';
    tdLabel.innerHTML = `<span class="ideal-name">${ideal.label}</span>`;
    tr.appendChild(tdLabel);

    CHARS.forEach(char => {
      const td = document.createElement('td');
      td.className = `val-cell ${char.cls}`;
      td.dataset.char = char.key;
      td.dataset.ideal = ideal.key;

      const val = state[char.key][ideal.key] ?? 0;
      td.innerHTML = `
        <div class="counter">
          <button class="btn" onclick="change('${char.key}','${ideal.key}',-1)" title="Decrease">−</button>
          <span class="val${val > 0 ? ' nonzero' : ''}" id="v-${char.key}-${ideal.key}">${val}</span>
          <button class="btn" onclick="change('${char.key}','${ideal.key}',1)" title="Increase">+</button>
        </div>`;
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
}

function renderValues() {
  IDEALS.forEach(ideal => {
    CHARS.forEach(char => {
      const el = document.getElementById(`v-${char.key}-${ideal.key}`);
      if (!el) return;
      const v = state[char.key][ideal.key] ?? 0;
      el.textContent = v;
      el.className = 'val' + (v > 0 ? ' nonzero' : '');
    });
  });
}

function change(charKey, idealKey, delta) {
  const current = state[charKey][idealKey] ?? 0;
  const next = Math.max(0, current + delta);
  state[charKey][idealKey] = next;
  const el = document.getElementById(`v-${charKey}-${idealKey}`);
  if (el) {
    el.textContent = next;
    el.className = 'val' + (next > 0 ? ' nonzero' : '');
    // Pulse animation
    el.style.transform = 'scale(1.3)';
    setTimeout(() => { el.style.transform = ''; }, 120);
  }
  dirty = true;
  updateSaveNote();
}

buildTable();
updateSaveNote();

// Auto-save on page unload
window.addEventListener('beforeunload', () => { if (dirty) saveData(); });
</script>
</body>
</html>
