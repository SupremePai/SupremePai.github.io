<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tier Lists · Supreme Pai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f2;
      --ink: #1a1917;
      --muted: #9a9890;
      --border: #e0ddd7;
      --pop: #2a9d8f;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      min-height: 100vh;
      padding: 0 24px;
    }

    header, .divider, main, footer { max-width: 620px; margin: 0 auto; }

    header { padding: 52px 0 40px; }

    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .eyebrow a { color: inherit; text-decoration: none; transition: color 0.2s; }
    .eyebrow a:hover { color: var(--pop); }

    header h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    header h1 em { font-style: italic; color: var(--muted); }

    .tagline { font-size: 0.78rem; color: var(--muted); line-height: 1.7; max-width: 420px; }
    .tagline .highlight { color: var(--pop); font-style: italic; }

    .divider { height: 1px; background: var(--border); position: relative; }
    .divider::after {
      content: '✦';
      position: absolute; left: 0; top: 50%;
      transform: translateY(-50%);
      font-size: 10px; color: var(--pop);
      background: var(--bg); padding-right: 10px;
    }

    main { padding: 52px 0 80px; }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .list {
      display: block;
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: padding-left 0.2s ease;
    }
    .list:first-child { border-top: 1px solid var(--border); }
    .list:hover { padding-left: 10px; }
    .list:hover .list-name { color: var(--pop); }

    .list-head { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
    .list-name {
      font-family: 'Instrument Serif', serif;
      font-size: 1.15rem;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      transition: color 0.2s ease;
    }
    .list-meta { font-size: 0.72rem; color: var(--muted); line-height: 1.6; font-style: italic; }
    .list-tag {
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); border: 1px solid var(--border);
      padding: 4px 8px; border-radius: 2px; white-space: nowrap; margin-top: 4px;
      transition: border-color 0.2s, color 0.2s;
    }
    .list:hover .list-tag { border-color: var(--pop); color: var(--pop); }

    .top { display: flex; align-items: stretch; margin-top: 12px; border: 1px solid var(--border); background: #fff; }
    .top-label {
      flex: 0 0 40px; display: flex; align-items: center; justify-content: center;
      font-family: 'Instrument Serif', serif; font-size: 1.15rem; padding: 4px;
      text-align: center; word-break: break-word;
    }
    .top-items { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; }
    .top-items span {
      font-size: 0.66rem; border: 1px solid var(--border); background: var(--bg);
      padding: 4px 7px; border-radius: 2px;
    }

    .notice { font-size: 0.78rem; color: var(--muted); line-height: 1.7; font-style: italic; }

    footer {
      padding-bottom: 48px;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--pop); }
    footer .left::before { content: '— '; }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow"><a href="index.html">Supreme Pai's Space</a></p>
    <h1>Tier Lists <em>by consensus</em></h1>
    <p class="tagline">Rankings argued out among friends, then made <span class="highlight">permanent and public.</span></p>
  </header>

  <div class="divider"></div>

  <main>
    <p class="section-label">All lists</p>
    <div id="lists"><p class="notice">Loading…</p></div>
  </main>

  <footer>
    <span class="left">Disagree? Take it up with the council.</span>
    <a href="tierlist.html?new=1" title="Make a new tier list">✦</a>
  </footer>

  <script>
  (() => {
    const box = document.getElementById('lists');
    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };
    const prettyDate = (iso) => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return '';
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    };
    const ID_RE = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;

    fetch('data/tierlists/index.json', { cache: 'no-cache' })
      .then(r => {
        if (r.status === 404) return { lists: [] };
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(data => {
        const lists = (data.lists || []).filter(l => ID_RE.test(l.id || ''));
        box.textContent = '';
        if (!lists.length) { box.append(el('p', 'notice', 'No tier lists yet.')); return; }

        lists.forEach((l, i) => {
          const a = el('a', 'list');
          a.href = `tierlist.html?id=${encodeURIComponent(l.id)}`;

          const head = el('div', 'list-head');
          const left = el('div');
          left.append(el('div', 'list-name', l.title || l.id));
          const bits = [];
          if (l.authors) bits.push('by ' + l.authors);
          if (l.date) bits.push(prettyDate(l.date));
          left.append(el('div', 'list-meta', bits.join(' · ')));
          head.append(left);
          if (typeof l.count === 'number') head.append(el('div', 'list-tag', `${l.count} items`));
          a.append(head);

          if (l.top && Array.isArray(l.top.items) && l.top.items.length) {
            const top = el('div', 'top');
            const lab = el('div', 'top-label', l.top.label || '');
            if (/^#[0-9a-f]{6}$/i.test(l.top.color || '')) lab.style.background = l.top.color;
            const items = el('div', 'top-items');
            l.top.items.forEach(t => items.append(el('span', '', t)));
            top.append(lab, items);
            a.append(top);
          }

          a.style.opacity = '0';
          a.style.transform = 'translateY(8px)';
          a.style.transition = `opacity 0.4s ease ${i * 0.08}s, transform 0.4s ease ${i * 0.08}s, padding-left 0.2s ease`;
          box.append(a);
          setTimeout(() => { a.style.opacity = '1'; a.style.transform = 'translateY(0)'; }, 80 + i * 80);
        });
      })
      .catch(e => {
        box.textContent = '';
        box.append(el('p', 'notice', `Couldn't load the lists (${e.message}). Try refreshing.`));
      });
  })();
  </script>
</body>
</html>
