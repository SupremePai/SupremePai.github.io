<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Baseball Draft Board 2026</title>
<style>
  :root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3248;--accent:#4f8ef7;--green:#3ddc84;--gold:#f5c842;--red:#ff5c5c;--orange:#ff9944;--text:#e8eaf0;--muted:#7a80a0;--drafted:#191b28;--drafted-text:#3a3d52;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;font-size:13px;}
  .header{background:linear-gradient(135deg,#1a1d27,#16213e);padding:12px 20px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
  .header h1{font-size:17px;font-weight:700;color:var(--accent);}
  .header .sub{color:var(--muted);font-size:11px;margin-top:2px;}
  .hstats{margin-left:auto;display:flex;gap:18px;font-size:11px;color:var(--muted);align-items:center;}
  .hstats b{color:var(--text);}
  .live-badge{background:#1a3d1a;border:1px solid var(--green);color:var(--green);padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;margin-left:8px;}
  .recalc-indicator{font-size:10px;color:var(--green);opacity:0;transition:opacity .3s;margin-left:6px;}
  .recalc-indicator.show{opacity:1;}
  .toolbar{padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .toolbar input[type=text]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-size:12px;width:260px;outline:none;}
  .toolbar input[type=text]:focus{border-color:var(--accent);}
  .toolbar label{color:var(--muted);font-size:11px;display:flex;align-items:center;gap:5px;cursor:pointer;}
  .toolbar input[type=checkbox]{accent-color:var(--accent);}
  .undraft-btn{background:#2a1a0a;border:1px solid var(--orange);color:var(--orange);padding:5px 13px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;transition:all .2s;}
  .undraft-btn:hover{background:var(--orange);color:#000;}
  .tabs{display:flex;gap:2px;padding:8px 20px 0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{padding:7px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);border:1px solid transparent;border-bottom:none;transition:all .15s;white-space:nowrap;}
  .tab:hover{color:var(--text);background:var(--surface2);}
  .tab.active{background:var(--bg);color:var(--accent);border-color:var(--border);border-bottom-color:var(--bg);}
  .tab .cnt{font-size:10px;color:var(--muted);margin-left:3px;}
  .tab.active .cnt{color:var(--accent);opacity:.7;}
  .tab-content{display:none;}
  .tab-content.active{display:block;}
  .table-wrap{overflow:auto;max-height:calc(100vh - 175px);}
  table{width:100%;border-collapse:collapse;}
  thead{position:sticky;top:0;z-index:10;}
  th{background:#1c2035;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:8px;text-align:center;border-bottom:2px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
  th:hover{color:var(--text);background:#222640;}
  th.sort-asc::after{content:" ↑";color:var(--accent);}
  th.sort-desc::after{content:" ↓";color:var(--accent);}
  th.left{text-align:left;}
  td{padding:5px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:center;vertical-align:middle;transition:color .25s,background .25s;}
  td.left{text-align:left;}
  tr:hover td{background:var(--surface2);}
  tr.drafted td{background:var(--drafted)!important;color:var(--drafted-text)!important;text-decoration:line-through;}
  tr.z-updated td.z-adj-cell{animation:zpulse .6s ease;}
  tr.z-rose td.z-adj-cell{color:#3ddc84!important;}
  tr.z-fell td.z-adj-cell{color:#ff5c5c!important;}
  @keyframes zpulse{0%{transform:scale(1.15);}100%{transform:scale(1);}}
  .rank-cell{font-weight:700;color:var(--muted);font-size:11px;}
  .name-cell{font-weight:600;font-size:13px;}
  .elig-cell{font-size:10px;color:#8090c0;}
  .pos-badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;}
  .pos-C{background:#3d2b00;color:#f5c842;}.pos-SS{background:#3d1a1a;color:#ff8080;}
  .pos-2B{background:#1a2d3d;color:#7ab8f5;}.pos-3B{background:#1a3d1a;color:#7af57a;}
  .pos-1B{background:#1a3d2d;color:#7af5c0;}.pos-LF{background:#2d1a3d;color:#c07af5;}
  .pos-CF{background:#2d2a1a;color:#f5d07a;}.pos-RF{background:#3d1a2d;color:#f57ac0;}
  .pos-SP{background:#1a2040;color:#7aaaf5;}.pos-RP{background:#401a20;color:#f57a7a;}
  .pos-DH{background:#2a2a2a;color:#aaa;}
  .z-hi{color:#3ddc84;font-weight:700;}.z-md{color:#f5c842;}.z-lo{color:#ff9944;}.z-ng{color:#ff5c5c;}
  .z-adj-cell{font-weight:800;font-size:13px;}
  .espn-cell{color:var(--muted);font-size:11px;}
  .espn-unranked{color:#3a3d52;font-size:11px;font-style:italic;}
  .type-h{color:var(--accent);font-size:10px;font-weight:700;}
  .type-p{color:var(--green);font-size:10px;font-weight:700;}
  .draft-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:4px;cursor:pointer;font-size:10px;font-weight:600;transition:all .15s;white-space:nowrap;}
  .draft-btn:hover{background:var(--red);border-color:var(--red);color:#fff;}
  tr.drafted .draft-btn{background:#2d1a1a;border-color:#5a2a2a;color:#5a3030;}
  tr.drafted .draft-btn:hover{background:var(--green);border-color:var(--green);color:#000;}
  #repl-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .repl-item{font-size:10px;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:var(--surface);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted);}
</style>
</head>

const OF_BLEND=0.5,OF_UNIFIED_SLOTS=48;
const POS_SLOTS={C:13,"1B":19,"2B":19,"3B":19,SS:19,LF:14,CF:14,RF:14,SP:57,RP:37};
const POS_PRI_H=["C","SS","2B","3B","1B","LF","CF","RF","OF","DH"];
const TABS=["Board","C","1B","2B","3B","SS","LF","CF","RF","SP","RP"];
const TAB_LABELS={"Board":"📋 All","C":"C","1B":"1B","2B":"2B","3B":"3B","SS":"SS","LF":"LF","CF":"CF","RF":"RF","SP":"SP","RP":"RP"};
const H_COLS=[["PA","pa",false],["HR","hr",false],["R","r",false],["RBI","rbi",false],["SB","sb",false],["OBP","obp",false],["z_HR","z_hr",true],["z_R","z_r",true],["z_RBI","z_rbi",true],["z_SB★","z_sb",true],["z_OBP","z_obp",true]];
const P_COLS=[["K","k",false],["ERA","era",false],["WHIP","whip",false],["QS","qs",false],["SV+HLD","svhld",false],["z_K","z_k",true],["z_ERA","z_era",true],["z_WHIP","z_whip",true],["z_QS","z_qs",true],["z_SV+HLD★","z_svhld",true]];
const REPL_COLORS={C:"#f5c842",SS:"#ff8080","2B":"#7ab8f5","3B":"#7af57a","1B":"#7af5c0",LF:"#c07af5",CF:"#f5d07a",RF:"#f57ac0",SP:"#7aaaf5",RP:"#f57a7a"};

let players=RAW.Board.map(p=>({…p}));
let drafted=new Set(JSON.parse(localStorage.getItem(“fb_drafted_2026”)||”[]”));
let curTab=“Board”,sortState={},prevRepl={};

function hasPos(p,pos){return p.elig.toUpperCase().split(”/”).includes(pos);}
function isLF(p){return hasPos(p,“LF”);}function isCF(p){return hasPos(p,“CF”);}
function isRF(p){return hasPos(p,“RF”);}function isOF(p){return isLF(p)||isCF(p)||isRF(p);}
function isSP(p){return p.primary===“SP”;}function isRP(p){return p.primary===“RP”;}

function computeReplLevels(){
const avail=players.filter(p=>!drafted.has(p.name));
function replZ(fn,slots){
const pool=avail.filter(fn).sort((a,b)=>b.z_raw-a.z_raw);
if(!pool.length)return 0;
return pool[Math.min(slots,pool.length)-1].z_raw;
}
const sLF=replZ(isLF,POS_SLOTS.LF),sCF=replZ(isCF,POS_SLOTS.CF),sRF=replZ(isRF,POS_SLOTS.RF);
const uni=replZ(isOF,OF_UNIFIED_SLOTS);
return{
C:replZ(p=>hasPos(p,“C”),POS_SLOTS.C),
“1B”:replZ(p=>hasPos(p,“1B”),POS_SLOTS[“1B”]),
“2B”:replZ(p=>hasPos(p,“2B”),POS_SLOTS[“2B”]),
“3B”:replZ(p=>hasPos(p,“3B”),POS_SLOTS[“3B”]),
SS:replZ(p=>hasPos(p,“SS”),POS_SLOTS.SS),
LF:OF_BLEND*sLF+(1-OF_BLEND)*uni,
CF:OF_BLEND*sCF+(1-OF_BLEND)*uni,
RF:OF_BLEND*sRF+(1-OF_BLEND)*uni,
SP:replZ(isSP,POS_SLOTS.SP),
RP:replZ(isRP,POS_SLOTS.RP),
};
}

function primaryPos(p){
if(p.type===“P”)return p.primary;
const parts=p.elig.toUpperCase().split(”/”);
for(const pos of POS_PRI_H)if(parts.includes(pos))return pos;
return”DH”;
}

function recalcAllAdjZ(){
const repl=computeReplLevels();
players.forEach(p=>{
const r=repl[primaryPos(p)]??0;
p.repl_z=Math.round(r*1000)/1000;
p.z_adj=Math.round((p.z_raw-r)*100)/100;
});
[…players].sort((a,b)=>b.z_adj-a.z_adj).forEach((p,i)=>p.overall_rank=i+1);
TABS.filter(t=>t!==“Board”).forEach(tab=>{
const tp=getTabPlayers(tab,players);
tp.sort((a,b)=>b.z_adj-a.z_adj);
tp.forEach((p,i)=>p[`rank_${tab}`]=i+1);
});
return repl;
}

function getTabPlayers(tab,pool){
if(tab===“Board”)return pool;
if([“SP”,“RP”].includes(tab))return pool.filter(p=>p.type===“P”&&p.primary===tab);
return pool.filter(p=>p.type===“H”&&hasPos(p,tab));
}

function zClass(v){if(v>=5)return”z-hi”;if(v>=2)return”z-md”;if(v>=0)return”z-lo”;return”z-ng”;}
function posBadge(pos){return`<span class="pos-badge pos-${pos}">${pos}</span>`;}
function fmtVal(v,key){
if(v===null||v===undefined)return”–”;
if(key===“obp”||key===“whip”)return(+v).toFixed(3);
if(key===“era”)return(+v).toFixed(2);
if(typeof v===“number”&&!Number.isInteger(v))return v.toFixed(2);
return v;
}
function espnCell(espn){
if(espn>0)return`<td class="espn-cell" data-espn="${espn}">${espn}</td>`;
return`<td class="espn-unranked" data-espn="9999">–</td>`;
}

function getColDefs(tab){
const isBoard=tab===“Board”,isH=[“C”,“1B”,“2B”,“3B”,“SS”,“LF”,“CF”,“RF”].includes(tab),isP=[“SP”,“RP”].includes(tab);
let cols=[{hdr:”#”,key:”_rank”,left:true},{hdr:“Player”,key:“name”,left:true}];
if(isBoard)cols.push({hdr:“T”,key:“type”});
cols.push({hdr:“Pos”,key:“primary”},{hdr:“Elig”,key:“elig”,left:true},{hdr:“ESPN”,key:“espn”});
if(isH||isBoard)H_COLS.forEach(([h,k,z])=>cols.push({hdr:h,key:k,isZ:z,isH:true}));
if(isP||isBoard)P_COLS.forEach(([h,k,z])=>cols.push({hdr:h,key:k,isZ:z,isP:true}));
cols.push({hdr:“Raw Z”,key:“z_raw”,isZ:true},{hdr:“Repl”,key:“repl_z”},{hdr:“ADJ Z★”,key:“z_adj”,isZ:true,isAdj:true},{hdr:””,key:”_draft”});
return cols;
}

function buildRow(p,tab,cols){
const isDrafted=drafted.has(p.name);
const isHitter=p.type===“H”||[“C”,“1B”,“2B”,“3B”,“SS”,“LF”,“CF”,“RF”].includes(tab);
const isBoard=tab===“Board”;
const rankVal=isBoard?p.overall_rank:(p[`rank_${tab}`]||”–”);
let row=`<tr class="${isDrafted?"drafted":""}" data-name="${p.name.replace(/"/g,"&quot;")}" data-type="${p.type}">`;
cols.forEach(c=>{
if(c.key===”_rank”){row+=`<td class="rank-cell left">${rankVal}</td>`;}
else if(c.key===“name”){row+=`<td class="name-cell left">${p.name}</td>`;}
else if(c.key===“type”){row+=`<td>${isHitter?'<span class="type-h">H</span>':'<span class="type-p">P</span>'}</td>`;}
else if(c.key===“primary”){row+=`<td>${posBadge(p.primary)}</td>`;}
else if(c.key===“elig”){row+=`<td class="elig-cell left">${p.elig}</td>`;}
else if(c.key===“espn”){row+=espnCell(p.espn);}
else if(c.key===”_draft”){row+=`<td><button class="draft-btn" onclick="toggleDraft(this)">${isDrafted?"↩ Undo":"✕ Draft"}</button></td>`;}
else if(c.key===“repl_z”){row+=`<td style="color:var(--muted);font-size:11px;">${typeof p.repl_z==="number"?p.repl_z.toFixed(2):"–"}</td>`;}
else if(c.isZ){
if(isBoard&&c.isH&&!isHitter){row+=`<td style="color:var(--border)">–</td>`;return;}
if(isBoard&&c.isP&&isHitter){row+=`<td style="color:var(--border)">–</td>`;return;}
const v=p[c.key];
row+=`<td class="${c.isAdj?"z-adj-cell ":""}${zClass(v)}">${typeof v==="number"?v.toFixed(2):"–"}</td>`;
}else{
if(isBoard&&c.isH&&!isHitter){row+=`<td style="color:var(--border)">–</td>`;return;}
if(isBoard&&c.isP&&isHitter){row+=`<td style="color:var(--border)">–</td>`;return;}
row+=`<td>${fmtVal(p[c.key],c.key)}</td>`;
}
});
return row+”</tr>”;
}

function buildTable(tab){
const cols=getColDefs(tab);
const tabPlayers=getTabPlayers(tab,players).sort((a,b)=>b.z_adj-a.z_adj);
let thead=”<tr>”;
cols.forEach((c,ci)=>{
if(c.key===”_draft”){thead+=`<th style="width:60px">Action</th>`;return;}
thead+=`<th class="${c.left?"left":""}" data-tab="${tab}" data-col="${c.key}" data-ci="${ci}" onclick="sortCol(this)">${c.hdr}</th>`;
});
thead+=”</tr>”;
return`<table id="tbl_${tab}"><thead>${thead}</thead><tbody>${tabPlayers.map(p=>buildRow(p,tab,cols)).join("")}</tbody></table>`;
}

function renderReplBar(repl){
const el=document.getElementById(“repl-bar”);
el.innerHTML=Object.keys(REPL_COLORS).map(pos=>{
const v=repl[pos]??0,changed=prevRepl[pos]!==undefined&&Math.abs(prevRepl[pos]-v)>0.01;
return`<span class="repl-item" style="${changed?"color:var(--gold);font-weight:700":""}"> <span style="color:${REPL_COLORS[pos]};font-weight:700">${pos}</span> <span style="color:var(--muted)"> ${v>=0?"+":""}${v.toFixed(2)}</span> </span>`;
}).join(””);
}

function liveUpdateZScores(oldAdjZ){
TABS.forEach(tab=>{
const wrap=document.getElementById(`tcont_${tab}`);if(!wrap)return;
const cols=getColDefs(tab);
const adjCI=cols.findIndex(c=>c.key===“z_adj”);
const replCI=cols.findIndex(c=>c.key===“repl_z”);
const rankCI=cols.findIndex(c=>c.key===”_rank”);
const isBoard=tab===“Board”;
wrap.querySelectorAll(“tbody tr”).forEach(row=>{
const name=row.dataset.name,p=players.find(x=>x.name===name);if(!p)return;
const prevZ=oldAdjZ[name]??p.z_adj,newZ=p.z_adj;
if(rankCI>=0&&row.children[rankCI])row.children[rankCI].textContent=isBoard?p.overall_rank:(p[`rank_${tab}`]||”–”);
if(replCI>=0&&row.children[replCI])row.children[replCI].textContent=typeof p.repl_z===“number”?p.repl_z.toFixed(2):”–”;
if(adjCI>=0&&row.children[adjCI]){
const cell=row.children[adjCI];
cell.textContent=newZ.toFixed(2);
cell.className=`z-adj-cell ${zClass(newZ)}`;
}
if(Math.abs(newZ-prevZ)>0.05){
row.classList.remove(“z-updated”,“z-rose”,“z-fell”);void row.offsetWidth;
row.classList.add(“z-updated”,newZ>prevZ?“z-rose”:“z-fell”);
setTimeout(()=>row.classList.remove(“z-updated”,“z-rose”,“z-fell”),800);
}
});
const tbody=wrap.querySelector(“tbody”);
if(tbody){
const rows=Array.from(tbody.querySelectorAll(“tr”));
rows.sort((a,b)=>{
const na=players.find(p=>p.name===a.dataset.name),nb=players.find(p=>p.name===b.dataset.name);
if(!na||!nb)return 0;return nb.z_adj-na.z_adj;
});
rows.forEach(r=>tbody.appendChild(r));
}
});
}

function recalcAndUpdate(){
const oldAdjZ={};players.forEach(p=>{oldAdjZ[p.name]=p.z_adj;});
const repl=recalcAllAdjZ();
renderReplBar(repl);prevRepl={…repl};
liveUpdateZScores(oldAdjZ);
const ind=document.getElementById(“recalc-ind”);
ind.classList.add(“show”);setTimeout(()=>ind.classList.remove(“show”),1500);
applyFilter();saveState();
}

function toggleDraft(btn){
const row=btn.closest(“tr”),name=row.dataset.name;
if(drafted.has(name)){
drafted.delete(name);
document.querySelectorAll(`tr[data-name="${name.replace(/"/g,"&quot;")}"]`).forEach(r=>{
r.classList.remove(“drafted”);r.querySelector(”.draft-btn”).textContent=“✕ Draft”;
});
}else{
drafted.add(name);
document.querySelectorAll(`tr[data-name="${name.replace(/"/g,"&quot;")}"]`).forEach(r=>{
r.classList.add(“drafted”);r.querySelector(”.draft-btn”).textContent=“↩ Undo”;
});
}
recalcAndUpdate();
}

function undraftAll(){
if(!confirm(“Reset the entire draft board?”))return;
drafted.clear();
document.querySelectorAll(“tr.drafted”).forEach(r=>{
r.classList.remove(“drafted”);const b=r.querySelector(”.draft-btn”);if(b)b.textContent=“✕ Draft”;
});
recalcAndUpdate();
}

function saveState(){
localStorage.setItem(“fb_drafted_2026”,JSON.stringify([…drafted]));
document.getElementById(“dc”).textContent=drafted.size;
document.getElementById(“ac”).textContent=TOTAL-drafted.size;
}

function buildUI(){
const tabsEl=document.getElementById(“tabs”),contEl=document.getElementById(“contents”);
const repl=recalcAllAdjZ();renderReplBar(repl);prevRepl={…repl};
TABS.forEach(tab=>{
const t=document.createElement(“div”);
t.className=“tab”+(tab===“Board”?” active”:””);t.id=`tbtn_${tab}`;
t.innerHTML=`${TAB_LABELS[tab]}<span class="cnt">(${getTabPlayers(tab,players).length})</span>`;
t.onclick=()=>switchTab(tab);tabsEl.appendChild(t);
const d=document.createElement(“div”);
d.className=“tab-content”+(tab===“Board”?” active”:””);d.id=`tcont_${tab}`;
d.innerHTML=`<div class="table-wrap">${buildTable(tab)}</div>`;
contEl.appendChild(d);
});
}

function switchTab(tab){
curTab=tab;
document.querySelectorAll(”.tab”).forEach(t=>t.classList.remove(“active”));
document.querySelectorAll(”.tab-content”).forEach(c=>c.classList.remove(“active”));
document.getElementById(`tbtn_${tab}`).classList.add(“active”);
document.getElementById(`tcont_${tab}`).classList.add(“active”);
applyFilter();
}

function applyFilter(){
const q=document.getElementById(“search”).value.toLowerCase(),hideD=document.getElementById(“hide-d”).checked;
const cont=document.querySelector(”.tab-content.active”);if(!cont)return;
cont.querySelectorAll(“tbody tr”).forEach(row=>{
const name=(row.dataset.name||””).toLowerCase();
const show=(!q||name.includes(q))&&(!hideD||!row.classList.contains(“drafted”));
row.style.display=show?””:“none”;
});
}

function sortCol(th){
const tab=th.dataset.tab,col=th.dataset.col,ci=parseInt(th.dataset.ci);
const prev=sortState[tab],dir=(prev&&prev.col===col&&prev.dir===“desc”)?“asc”:“desc”;
sortState[tab]={col,dir};
const tbody=document.querySelector(`#tbl_${tab} tbody`);if(!tbody)return;
const rows=Array.from(tbody.querySelectorAll(“tr”));
rows.sort((a,b)=>{
if(col===“espn”){
const av=parseInt(a.querySelector(“td[data-espn]”)?.dataset.espn||“9999”);
const bv=parseInt(b.querySelector(“td[data-espn]”)?.dataset.espn||“9999”);
return dir===“desc”?av-bv:bv-av;
}
const av=a.children[ci]?.textContent.trim()||””,bv=b.children[ci]?.textContent.trim()||””;
const an=parseFloat(av.replace(/[^0-9.-]/g,””)),bn=parseFloat(bv.replace(/[^0-9.-]/g,””));
if(!isNaN(an)&&!isNaN(bn))return dir===“desc”?bn-an:an-bn;
return dir===“desc”?bv.localeCompare(av):av.localeCompare(bv);
});
rows.forEach(r=>tbody.appendChild(r));
th.closest(“thead”).querySelectorAll(“th”).forEach(h=>h.classList.remove(“sort-asc”,“sort-desc”));
th.classList.add(dir===“desc”?“sort-desc”:“sort-asc”);
}

buildUI();
drafted.forEach(name=>{
document.querySelectorAll(`tr[data-name="${name.replace(/"/g,"&quot;")}"]`).forEach(r=>{
r.classList.add(“drafted”);const b=r.querySelector(”.draft-btn”);if(b)b.textContent=“↩ Undo”;
});
});
saveState();
</script>
